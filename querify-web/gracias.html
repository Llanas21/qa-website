<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! — Querify Analytics</title>
<meta name="description" content="Recibimos tus datos. Te contactamos por WhatsApp muy pronto.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/img/querify-logo.svg">
<link rel="stylesheet" href="assets/css/styles.css">
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4857261c966a4a6fae52a9c93bc4251f"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<header class="site-header">
  <div class="container bar">
    <a class="brand" href="index.html" aria-label="Querify Analytics — inicio">
      <img class="glyph" src="assets/img/querify-logo.svg" width="34" height="34" alt="Querify Analytics">
      <span class="wordmark">Querify<span class="tag">Analytics</span></span>
    </a>
  </div>
</header>

<main class="thanks">
  <div class="thanks-card">
    <div class="check">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>¡Listo! Recibimos tus datos</h1>
    <p class="lede">Gracias por tu interés en Querify Analytics. En breve te escribimos con la información del curso, los horarios disponibles y cómo apartar tu lugar.</p>
    <div class="wa" id="canal-badge">
      <svg id="canal-icon-wa" viewBox="0 0 24 24" width="17" height="17" fill="#2563EB" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5.2-.4c0-.2 0-.3-.1-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.7.7-.9 1.6-.6 2.6.4 1.3 1.2 2.5 2.4 3.5 1.5 1.3 2.9 1.8 4.3 1.9.6 0 1.2-.1 1.6-.5.3-.3.5-.8.5-1.2 0-.2 0-.3-.2-.4z"/></svg>
      <svg id="canal-icon-correo" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
      <span id="canal-text">Te contactaremos por WhatsApp</span>
    </div>
    <div class="actions">
      <a class="btn btn-primary btn-lg" href="index.html">Volver al inicio</a>
      <a class="btn btn-ghost btn-lg on-dark" href="index.html#cursos">Ver los cursos</a>
    </div>
  </div>
</main>

<script>
  // El canal (whatsapp/correo) lo manda app.js en la URL al redirigir aquí,
  // según si dejaste WhatsApp en el formulario o no.
  if (new URLSearchParams(location.search).get('canal') === 'correo') {
    document.getElementById('canal-text').textContent = 'Te contactaremos por correo';
    document.getElementById('canal-icon-wa').style.display = 'none';
    document.getElementById('canal-icon-correo').style.display = '';
  }
</script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
